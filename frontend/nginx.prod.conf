events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # HTTP server: redirect to HTTPS + serve ACME challenges
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server: www to apex redirect
    server {
        listen 443 ssl http2;
        server_name www.$DOMAIN;

        ssl_certificate     /etc/nginx/ssl/live/$DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/$DOMAIN/privkey.pem;

        return 301 https://$DOMAIN$request_uri;
    }

    # HTTPS server: main site
    server {
        listen 443 ssl http2;
        server_name $DOMAIN;

        ssl_certificate     /etc/nginx/ssl/live/$DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/$DOMAIN/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # Server-level headers apply only to locations that do not set add_header.
        include /etc/nginx/hsts.conf;
        include /etc/nginx/security-headers.conf;

        root /usr/share/nginx/html;
        index index.html;

        # Serve robots.txt with correct content-type
        location = /robots.txt {
            include /etc/nginx/hsts.conf;
            include /etc/nginx/security-headers.conf;
            add_header Content-Type text/plain;
        }

        # Serve sitemap.xml with correct content-type
        location = /sitemap.xml {
            include /etc/nginx/hsts.conf;
            include /etc/nginx/security-headers.conf;
            add_header Content-Type application/xml;
        }

        location = /site.webmanifest {
            default_type application/manifest+json;
            include /etc/nginx/hsts.conf;
            include /etc/nginx/security-headers.conf;
            add_header Content-Type application/manifest+json;
            try_files $uri =404;
        }

        # index.html: always revalidate so deploys pick up new hashed asset URLs.
        # try_files SPA fallback internally redirects here, so / and /some/route
        # get the same cache policy. ETag/Last-Modified stay on (no `etag off`).
        location = /index.html {
            include /etc/nginx/hsts.conf;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header Expires "0" always;
        }

        location / {
            # SPA: serve index.html for all routes except explicit 404s
            try_files $uri $uri/ /index.html =404;
            include /etc/nginx/hsts.conf;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header Expires "0" always;
        }

        # Hashed Vite assets — ^~ wins over regex so this always applies.
        location ^~ /assets/ {
            include /etc/nginx/hsts.conf;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location ~* \.(?:js|css|woff2?|ttf|eot)$ {
            include /etc/nginx/hsts.conf;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp)$ {
            include /etc/nginx/hsts.conf;
            include /etc/nginx/security-headers.conf;
            expires 7d;
            add_header Cache-Control "public" always;
            try_files $uri =404;
        }

        location ~* \.(?:json|xml|txt)$ {
            include /etc/nginx/hsts.conf;
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 30s;
            proxy_send_timeout    30s;
            proxy_read_timeout    60s;
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
