<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="150" fill="#ffffff" opacity="0.05"/>
  <circle cx="1100" cy="530" r="200" fill="#ffffff" opacity="0.05"/>
  
  <!-- Flash card representation -->
  <g transform="translate(800, 200)">
    <rect x="0" y="0" width="320" height="200" rx="12" fill="url(#cardGradient)" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <text x="160" y="80" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff" text-anchor="middle">`}</text>
    <text x="160" y="140" font-family="Arial, sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" opacity="0.9">n– hŒo</text>
    <text x="160" y="175" font-family="Arial, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" opacity="0.8">hello</text>
  </g>
  
  <!-- Main branding -->
  <g transform="translate(80, 280)">
    <!-- MandarinFlash text -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="84" font-weight="bold" fill="#ffffff">
      MandarinFlash
    </text>
    
    <!-- Tagline -->
    <text x="0" y="70" font-family="Arial, sans-serif" font-size="32" fill="#ffffff" opacity="0.95">
      Learn Mandarin Chinese
    </text>
    <text x="0" y="115" font-family="Arial, sans-serif" font-size="28" fill="#ffffff" opacity="0.85">
      Free interactive flashcards &amp; HSK vocabulary
    </text>
  </g>
</svg>
