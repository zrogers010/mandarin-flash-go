events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # --- HTTP server: redirect to HTTPS in production, serve directly in dev ---
    server {
        listen 80;
        server_name _;

        # In production with TLS certs present, redirect all HTTP → HTTPS
        # Comment this block out for local / docker-compose development
        # if ($scheme = "http") {
        #     return 301 https://$host$request_uri;
        # }

        root /usr/share/nginx/html;
        index index.html;

        # Server-level headers apply only to locations that do not set add_header.
        include /etc/nginx/security-headers-http.conf;

        # Serve robots.txt with correct content-type
        location = /robots.txt {
            include /etc/nginx/security-headers-http.conf;
            add_header Content-Type text/plain;
        }

        # Serve sitemap.xml with correct content-type
        location = /sitemap.xml {
            include /etc/nginx/security-headers-http.conf;
            add_header Content-Type application/xml;
        }

        location = /site.webmanifest {
            default_type application/manifest+json;
            include /etc/nginx/security-headers-http.conf;
            add_header Content-Type application/manifest+json;
            try_files $uri =404;
        }

        # index.html: always revalidate so deploys pick up new hashed asset URLs.
        # try_files SPA fallback internally redirects here, so / and /some/route
        # get the same cache policy. ETag/Last-Modified stay on (no `etag off`).
        location = /index.html {
            include /etc/nginx/security-headers-http.conf;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header Expires "0" always;
        }

        # Handle client-side routing
        location / {
            try_files $uri $uri/ /index.html;
            include /etc/nginx/security-headers-http.conf;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header Expires "0" always;
        }

        # Hashed Vite assets — ^~ wins over regex so this always applies.
        location ^~ /assets/ {
            include /etc/nginx/security-headers-http.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Other hashed static files outside /assets/
        location ~* \.(js|css|woff|woff2|ttf|eot)$ {
            include /etc/nginx/security-headers-http.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
            include /etc/nginx/security-headers-http.conf;
            expires 7d;
            add_header Cache-Control "public" always;
        }

        # API proxy with rate limiting
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout    30s;
            proxy_read_timeout    60s;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # --- HTTPS server (uncomment when deploying with TLS certs) ---
    # Production uses nginx.prod.conf via docker-entrypoint-ssl.sh.
    # server {
    #     listen 443 ssl http2;
    #     server_name mandarinflash.com www.mandarinflash.com;
    #     ...
    # }
}
