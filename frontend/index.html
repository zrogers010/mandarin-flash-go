    <script>
      // Strip reset/verify tokens before GA4 or third-party requests can see them.
      // Stash the value so React can still complete the flow.
      (function () {
        try {
          var u = new URL(window.location.href);
          if (u.searchParams.has('token')) {
            window.__MF_AUTH_TOKEN__ = u.searchParams.get('token');
            u.searchParams.delete('token');
            var search = u.searchParams.toString();
            window.history.replaceState({}, document.title, u.pathname + (search ? '?' + search : '') + u.hash);
          }
        } catch (e) {}
      })();
    </script>

  <body>
    <script>
      // Apply the persisted theme before first paint to avoid a flash of the
      // wrong color scheme. Kept in sync with src/contexts/ThemeContext.tsx.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || ((stored === 'system' || !stored) && prefersDark);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
